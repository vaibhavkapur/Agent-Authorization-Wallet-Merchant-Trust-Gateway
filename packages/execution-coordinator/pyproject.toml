[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aaw-exec"
version = "0.1.0"
description = "Execution coordinator: atomic claims, payment simulator, reconciliation worker"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0",
    "aaw-domain"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aaw_exec*"]
