[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aaw-tap"
version = "0.1.0"
description = "Trusted Agent Protocol (RFC 9421) request signer and gateway verifier"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42",
    "aaw-domain"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aaw_tap*"]
