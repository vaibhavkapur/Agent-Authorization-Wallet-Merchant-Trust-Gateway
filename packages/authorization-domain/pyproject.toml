[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aaw-domain"
version = "0.1.0"
description = "Authorization domain: outcomes, reason codes, persistence models, trust store, verification pipeline"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "aaw-signer"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aaw_domain*"]
