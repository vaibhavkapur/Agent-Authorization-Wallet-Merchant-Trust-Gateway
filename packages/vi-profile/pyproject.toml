[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aaw-vi"
version = "0.1.0"
description = "Verifiable Intent draft v0.1 profile adapter (vendored reference implementation)"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42",
    "aaw-signer",
    "aaw-domain"
]

[tool.setuptools.packages.find]
where = [".", "vendor"]
include = ["aaw_vi*", "verifiable_intent*"]
