[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aaw-registry"
version = "0.1.0"
description = "Test agent registry (TAP keys). Test participant, not network accreditation."
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "aaw-domain",
    "aaw-signer"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aaw_registry*"]
